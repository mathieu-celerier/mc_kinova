ObserverPipelines:
  - name: "KinovaEncoderPipeline"
    observers:
      - type: Encoder
        config:
          velocity: encoderVelocities
# Drop measurements taken near a limb-jacobian singularity. Disabled (0): the conditioning of the
# arm's jacobian has no bearing on the quality of a wrench measurement, and with 0.08 it rejected
# 7 of the 12 static poses of a 12-pose run -- including every pose where gravity pointed along -y
# in the sensor frame, which is exactly what separates the tool mass from the force offset. The
# solver then converged happily on 5 poses with a badly conditioned problem.
SingularityThreshold: 0
forceSensors:
  - EEForceSensor
# Use the Bota's built-in IMU rather than the robot kinematics as the source of the
# acceleration/angular velocity of the sensor's parent body (see the calibration controller's
# README.md, "Using an IMU"). "Accelerometer" is the mc_rbdyn::BodySensor declared by the Kinova
# robot module on the FT_sensor_imu link. It is filled by the mc_ros_imu_sensor plugin on the
# real robot, and by mc_mujoco from the Accelerometer_accelerometer/Accelerometer_gyro sensors
# in simulation. Both publish raw sensor_msgs/Imu-style specific force, hence gravityIncluded.
imu:
  enabled: true
  bodySensor: Accelerometer
  gravityIncluded: true
  angularAccelerationFromGyro: true
  staleTimeout: 0.05
# Offline zero-phase Savitzky-Golay smoothing of the recorded series before the fit. Skipped
# automatically in staticPoses mode, where per-pose averaging plays the same role.
filter:
  enabled: true
  halfWindow: 25
  polyOrder: 2
initial_posture:
  completion:
    eval: 0.05
  target:
    joint_1: [0.0]
    joint_2: [0.2]
    joint_3: [3.14]
    joint_4: [-1.6]
    joint_5: [0.0]
    joint_6: [0.1]
    joint_7: [1.57]
motion:
  duration: 50
  stiffness: 10
  # continuous: the historical behaviour, joints follow their cosine (`duration` and the per-joint
  # `period` below apply to this mode only) and every tick is logged. The CalibrateStatic FSM
  # state overrides this to staticPoses, which spreads `poses` waypoints over each joint's range
  # and holds still at each one; the parameters below only apply there.
  mode: continuous
  poses: 12
  settleTime: 0.5
  dwellTime: 1.0
  velocityThreshold: 0.01   # rad/s, "the robot has stopped moving" -- this alone decides settling
  # rad; diagnostic only, not a settling condition. The posture task has no integral action, so
  # under gravity the arm rests slightly off its commanded waypoint; that is logged, not waited on.
  positionTolerance: 0.01
  minTransitTime: 0.2       # s, wait this long after commanding before looking for stillness
  # Give up on a robot that never stops moving and record it anyway. At stiffness 10 this arm
  # needs a bit over 5s to converge on a waypoint, so the previous 5.0 fired on most poses and let
  # the tail of the motion leak into the averaging window.
  settleTimeout: 8.0
  joints:
    - name: joint_4
      period: 10
      # Explicit asymmetric bounds instead of a symmetric percentLimits shrink: the collision
      # risk with the peg plate mounted is only on the lower (more negative) side, near the
      # initial posture below. Keep that side conservative (same as the previous
      # percentLimits: 0.5 window) but use the full safe range on the upper side, which was
      # being unnecessarily restricted too and was starving the calibration solver of pose
      # diversity (joint_4 hard limits in callib mode: [-2.45, 0.45]).
      lower: -1.725
      upper: 0.45
    - name: joint_5
      period: 12.5
      percentLimits: 1.0
    - name: joint_6
      period: 15
      percentLimits: 0.8
    - name: joint_7
      period: 17.5
      percentLimits: 1.0
