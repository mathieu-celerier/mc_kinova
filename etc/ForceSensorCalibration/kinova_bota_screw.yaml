ObserverPipelines:
  - name: "KinovaEncoderPipeline"
    observers:
      - type: Encoder
        config:
          velocity: encoderVelocities
# Drop measurements taken near a limb-jacobian singularity. Disabled (0): the conditioning of the
# arm's jacobian has no bearing on the quality of a wrench measurement, and rejecting whole regions
# of the workspace removes exactly the orientations that separate the tool mass from the sensor's
# force offset.
SingularityThreshold: 0
forceSensors:
  - EEForceSensor
initial_posture:
  completion:
    eval: 0.05
  target:
    joint_1: [0.0]
    joint_2: [0.5]
    joint_3: [3.14]
    joint_4: [-2.1]
    joint_5: [0.0]
    joint_6: [0.1]
    joint_7: [1.57]
motion:
  duration: 50
  stiffness: 10
  joints:
    - name: joint_4
      period: 10
      percentLimits: 0.9
    - name: joint_5
      period: 12.5
      percentLimits: 1.0
    - name: joint_6
      period: 15
      percentLimits: 0.9
    - name: joint_7
      period: 17.5
      percentLimits: 1.0
