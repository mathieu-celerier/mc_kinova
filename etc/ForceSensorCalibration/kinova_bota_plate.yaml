ObserverPipelines:
  - name: "KinovaEncoderPipeline"
    observers:
      - type: Encoder
        config:
          velocity: encoderVelocities
SingularityThreshold: 0.08
forceSensors:
  - EEForceSensor
initial_posture:
  completion:
    eval: 0.05
  target:
    joint_1: [0.0]
    joint_2: [0.5]
    joint_3: [3.14]
    joint_4: [-1.7]
    joint_5: [0.0]
    joint_6: [0.1]
    joint_7: [1.57]
motion:
  duration: 50
  stiffness: 10
  joints:
    - name: joint_4
      period: 10
      # Explicit asymmetric bounds instead of a symmetric percentLimits shrink: the collision
      # risk with the plate mounted is only on the lower (more negative) side, near the
      # initial posture below. Keep that side conservative (same as the previous
      # percentLimits: 0.6 window) but use the full safe range on the upper side, which was
      # being unnecessarily restricted too and was starving the calibration solver of pose
      # diversity (joint_4 hard limits in callib mode: [-2.45, 0.45]).
      lower: -1.87
      upper: 0.45
    - name: joint_5
      period: 12.5
      percentLimits: 1.0
    - name: joint_6
      period: 15
      percentLimits: 0.8
    - name: joint_7
      period: 17.5
      percentLimits: 1.0
